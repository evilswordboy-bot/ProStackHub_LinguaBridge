<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1020"/>
      <stop offset="50%" stop-color="#111A33"/>
      <stop offset="100%" stop-color="#16203D"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#00D9FF"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- App Icon Background rounded rect for Android adaptive icon -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)"/>
  
  <!-- Outer glowing accent ring -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="url(#accentGrad)" stroke-width="12" filter="url(#glow)"/>
  
  <!-- Globe Grid Lines -->
  <ellipse cx="256" cy="256" rx="90" ry="170" fill="none" stroke="#00D9FF" stroke-width="6" opacity="0.6"/>
  <ellipse cx="256" cy="256" rx="170" ry="85" fill="none" stroke="#7C3AED" stroke-width="6" opacity="0.6"/>
  <line x1="86" y1="256" x2="426" y2="256" stroke="#00D9FF" stroke-width="6" opacity="0.8"/>
  <line x1="256" y1="86" x2="256" y2="426" stroke="#7C3AED" stroke-width="6" opacity="0.8"/>

  <!-- Center Bridge Symbol & Letter A / 文 -->
  <circle cx="256" cy="256" r="60" fill="#0B1020" stroke="#00D9FF" stroke-width="4"/>
  <text x="256" y="278" font-family="'Space Grotesk', system-ui, sans-serif" font-size="64" font-weight="bold" fill="#F8FAFC" text-anchor="middle">🌐</text>
</svg>
